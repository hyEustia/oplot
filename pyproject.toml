[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oplot"
version = "0.1.0"
description = "科研出图工具：热图/火山图/箱线图/核密度/熵值法 TOPSIS"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "scipy>=1.7",
    "scikit-image>=0.19",
]

[project.scripts]
oplot = "oplot.cli:main"

[tool.setuptools]
packages = ["oplot"]
